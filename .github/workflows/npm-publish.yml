name: Reusable npm publishing

on:
  workflow_call:
    inputs:
      test-command:
        description: Command to run before publishing
        required: false
        type: string
        default: npm test --if-present
      build-command:
        description: Command to build the package
        required: false
        type: string
        default: npm run build --if-present

permissions:
  contents: read
  id-token: write

# Serialise releases from all supported branches of each package repository.
concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' || startsWith(github.ref, 'refs/heads/releases/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out calling repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with OIDC support
        run: npm install --global 'npm@^11.21.0'

      - name: Determine release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          # Validate version and separate the major version / prerelease suffix.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid SemVer package version: $VERSION" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          PRERELEASE="${BASH_REMATCH[4]:-}"

          case "$GITHUB_REF_NAME" in
            main)
              # Only main may stage stable major releases.
              DIST_TAG=latest
              if [[ -n "$PRERELEASE" ]]; then
                echo "main must publish a stable version, not $VERSION" >&2
                exit 1
              fi
              ;;
            next)
              DIST_TAG=next
              if [[ -z "$PRERELEASE" ]]; then
                echo "next only accepts prerelease versions (e.g. 6.0.0-beta.1), not $VERSION" >&2
                exit 1
              fi
              ;;
            releases/v*)
              # A maintenance branch can never release a different major.
              if [[ ! "$GITHUB_REF_NAME" =~ ^releases/v(0|[1-9][0-9]*)$ ]]; then
                echo "Invalid maintenance branch: $GITHUB_REF_NAME (expected releases/vN)" >&2
                exit 1
              fi
              RELEASE_MAJOR="${BASH_REMATCH[1]}"
              if [[ "$MAJOR" != "$RELEASE_MAJOR" ]]; then
                echo "$GITHUB_REF_NAME only accepts $RELEASE_MAJOR.x versions, not $VERSION" >&2
                exit 1
              fi
              # npm rejects version-like dist-tags such as v5.
              DIST_TAG="release-$RELEASE_MAJOR"
              ;;
            *)
              echo "Unsupported publishing branch: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Candidate: $PACKAGE@$VERSION (dist-tag: $DIST_TAG)"

      - name: Check exact version on npm
        id: published
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const { PACKAGE, VERSION, GITHUB_OUTPUT } = process.env;
          const url = 'https://registry.npmjs.org/' +
            encodeURIComponent(PACKAGE) + '/' + encodeURIComponent(VERSION);
          const response = await fetch(url);
          if (response.status !== 200 && response.status !== 404) {
            throw new Error('npm registry lookup failed: HTTP ' + response.status);
          }

          const exists = response.status === 200;
          appendFileSync(GITHUB_OUTPUT, 'exists=' + exists + '\n');
          console.log(exists
            ? PACKAGE + '@' + VERSION + ' is already published; skipping.'
            : PACKAGE + '@' + VERSION + ' is not publicly published (it may still be staged).');
          NODE

      - name: Install dependencies
        if: steps.published.outputs.exists == 'false'
        run: npm ci

      - name: Run tests
        if: steps.published.outputs.exists == 'false'
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"

      - name: Build package
        if: steps.published.outputs.exists == 'false'
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Stage package on npm for maintainer approval
        if: steps.published.outputs.exists == 'false'
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: npm stage publish --access public --tag "$DIST_TAG" --registry https://registry.npmjs.org
