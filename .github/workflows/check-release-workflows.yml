name: Check reusable release workflows

on:
  pull_request:
    paths:
      [
        ".github/workflows/**",
        "workflow-templates/**",
        "tests/**",
        "package.json",
        "package-lock.json",
        "tsconfig.json",
      ]
  push:
    branches: [main]
    paths:
      [
        ".github/workflows/**",
        "workflow-templates/**",
        "tests/**",
        "package.json",
        "package-lock.json",
        "tsconfig.json",
      ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
